naftiko: 1.0.0-alpha2
info:
  label: Assurant APEX Embedded Insurance API — Policies
  description: 'Assurant APEX Embedded Insurance API — Policies. 1 operations. Lead operation: List policies. Self-contained
    Naftiko capability covering one Assurant business surface.'
  tags:
  - Assurant
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASSURANT_API_KEY: ASSURANT_API_KEY
capability:
  consumes:
  - type: http
    namespace: apex-insurance-policies
    baseUri: https://api-prod.portal.assurant.com
    description: Assurant APEX Embedded Insurance API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: policies
      path: /policies
      operations:
      - name: listpolicies
        method: GET
        description: List policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.ASSURANT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: apex-insurance-policies-rest
    port: 8080
    description: REST adapter for Assurant APEX Embedded Insurance API — Policies. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/policies
      name: policies
      description: REST surface for policies.
      operations:
      - method: GET
        name: listpolicies
        description: List policies
        call: apex-insurance-policies.listpolicies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apex-insurance-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Assurant APEX Embedded Insurance API — Policies. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-policies
      description: List policies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apex-insurance-policies.listpolicies
      outputParameters:
      - type: object
        mapping: $.
