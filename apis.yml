  - type: Features
    data:
      - name: Embedded Device Protection
        description: >-
          APIs for embedding smartphone, tablet, and consumer electronics protection programs directly into carrier,
          retailer, and OEM customer experiences.
      - name: Claims Management
        description: >-
          End-to-end claims management APIs supporting claim filing, status tracking, device diagnostics, and
          repair/replacement fulfillment.
      - name: Renter's Insurance
        description: >-
          API integration for embedding renter's insurance enrollment, policy management, and claims into property
          management platforms.
      - name: Auto F&I Products
        description: >-
          Finance and insurance product APIs for automotive dealers including vehicle service contracts, GAP insurance,
          and protection products.
      - name: Connected Living Services
        description: Smart home device protection and tech support service APIs for connected device ecosystems.
  - type: UseCases
    data:
      - name: Mobile Carrier Device Protection
        description: >-
          Mobile carriers integrate APEX APIs to offer device protection plans at point of sale and manage claims for
          damaged or lost devices.
      - name: Property Management Renters Insurance
        description: >-
          Property management companies integrate the Global Housing API to offer and track renter's insurance
          compliance among tenants.
      - name: Auto Dealer F&I Integration
        description: >-
          Auto dealers and F&I providers integrate Assurant's vehicle protection APIs into dealer management systems for
          protection product sales.
      - name: E-Commerce Protection Programs
        description: >-
          Retailers integrate APEX APIs to offer product protection programs at checkout for electronics, appliances,
          and other products.
  - type: Integrations
    data:
      - name: Carrier Billing Systems
        description: >-
          Integration with mobile carrier billing and CRM systems for device protection plan enrollment and premium
          collection.
      - name: Property Management Platforms
        description: >-
          Integration with property management software including Yardi, RealPage, and AppFolio for renter's insurance
          programs.
      - name: Dealer Management Systems
        description: >-
          Integration with automotive DMS platforms for F&I product enrollment and vehicle protection program
          management.
