name: Assurant
description: >-
  Assurant is a global provider of lifestyle and housing solutions that help people thrive in a connected world. The
  company provides protection products and services including device protection, renter's insurance, auto F&I products,
  and connected living services. Assurant's APEX (Assurant Product Experience Exchange) platform provides embedded
  insurance APIs that enable partners to integrate protection products, claims management, and diagnostics directly into
  their workflows and customer experiences. The APEX platform supports 99.95% uptime and covers multiple product lines
  across technology, real estate, auto, and retail industries.
